name: Agent

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      (github.event.label.name == 'agent:go' || github.event.label.name == 'agent:apply') &&
      contains(github.event.issue.labels.*.name, 'type:requirement')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      PHASE: ${{ github.event.label.name == 'agent:go' && 'go' || 'apply' }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare branch
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then exists=1; else exists=0; fi
          if [ "$PHASE" = go ] && [ "$exists" = 1 ]; then
            echo "::error::branch $BRANCH already exists; phase go starts from main only"; exit 1
          fi
          if [ "$PHASE" = apply ] && [ "$exists" = 0 ]; then
            echo "::error::branch $BRANCH does not exist; run phase go first"; exit 1
          fi
          if [ "$PHASE" = go ]; then git switch -c "$BRANCH"; else git switch "$BRANCH"; fi
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git show origin/main:.github/agent/publish.sh > "$RUNNER_TEMP/agent_publish.sh"
          chmod +x "$RUNNER_TEMP/agent_publish.sh"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . ruff==0.16.1 pytest==8.4.2
      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@402b5b79551e3ce6614c179fbccbfdb79291cead # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repository ${{ github.repository }}, Issue #${{ github.event.issue.number }}, phase `${{ env.PHASE }}`.
            Read .github/agent/AGENT.md and follow it exactly.
            Publish command: ${{ runner.temp }}/agent_publish.sh
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh issue view:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ruff:*),Bash(python -m pytest:*),Bash(npx -y @fission-ai/openspec@1.16.0:*),Bash(taskbook:*),Bash(ls:*),Bash(cat:*),Bash(${{ runner.temp }}/agent_publish.sh:*)"
            --json-schema '{"type":"object","required":["route","change_id","pr_title","summary"],"properties":{"route":{"enum":["direct","openspec","implemented","blocked","failed"]},"change_id":{"type":"string"},"pr_title":{"type":"string"},"summary":{"type":"string"}}}'
      - name: Agent result on failure
        if: failure() && steps.claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          test -n "$EXECUTION_FILE" || { echo "::error::claude step set no execution_file"; exit 1; }
          python - <<'PY'
          import json, os
          messages = json.load(open(os.environ["EXECUTION_FILE"]))
          result = [m for m in messages if m.get("type") == "result"][-1]
          for key in ("subtype", "is_error", "num_turns", "result", "errors", "api_error_status"):
              if key in result:
                  print(f"{key}: {str(result[key])[:2000]}")
          PY
      - name: Check outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          route=$(python -c 'import json,os;print(json.loads(os.environ["RESULT"])["route"])')
          summary=$(python -c 'import json,os;print(json.loads(os.environ["RESULT"])["summary"])')
          echo "route=$route phase=$PHASE"
          case "$PHASE:$route" in
            go:direct|go:openspec|apply:implemented) ;;
            *) gh issue comment "$ISSUE" --body "Agent stopped (phase $PHASE, route $route): $summary"
               echo "::error::agent ended with route $route in phase $PHASE: $summary"; exit 1 ;;
          esac
          pr=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          test -n "$pr" || { echo "::error::agent reported $route but no open PR from $BRANCH"; exit 1; }
          echo "PR: $pr"
