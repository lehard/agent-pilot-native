name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.1 pytest==8.4.2
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: ADD gate
        if: github.event_name == 'pull_request'
        env:
          ADD_APPROVER: lehard
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_add.py
