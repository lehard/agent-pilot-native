[project]
name = "taskbook"
version = "0.1.0"
description = "Tiny command-line task tracker used as an agent pilot fixture"
requires-python = ">=3.12"

[project.scripts]
taskbook = "taskbook.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
